spring.application.name=QuickBasket-API

# ============ SERVER ============
server.port=8080
server.error.include-message=always
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024

# ============ DATABASE ============
spring.datasource.url=jdbc:mysql://localhost:3306/dmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=QuickBasketHikariPool

# ============ JPA / HIBERNATE ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ============ LOGGING ============
logging.level.org.springframework=INFO
logging.level.com.dmart.clone=DEBUG
logging.level.com.zaxxer.hikari=INFO

# ============ API DOCS ============
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ============ JWT ============
app.jwt.secret=MySuperSecureJwtSecretKeyThatIsAtLeast32Chars!
app.jwt.expirationMs=3600000
app.jwt.refreshExpirationMs=604800000

# ============ FILE UPLOAD ============
disk.upload.basepath=D:/Personal Projects/QuickBasket-Ecommerce-System/Images
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============ ADMIN SEEDER ============
app.admin.username=admin
app.admin.email=admin@example.com
app.admin.password=Adminpassword@123

# ============ RAZORPAY ============
razorpay.key.id=rzp_test_SwlmHaUbz1T9aN
razorpay.key.secret=h6zGWruP50E7mpLNGDXw3iWw

# ============ RATE LIMITING ============
app.ratelimit.auth.requests-per-minute=10
app.ratelimit.api.requests-per-minute=60

# ============ REDIS ============
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# Cache TTL (seconds)
app.cache.ttl.default=300
app.cache.ttl.categories=1800
app.cache.ttl.products=300
