spring.application.name=QuickBasket-API

# ============ SERVER ============
server.port=8080
server.error.include-message=always
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024

# ============ DATABASE ============
# Credentials are read from env vars; the defaults are for local dev only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=QuickBasketHikariPool

# ============ JPA / HIBERNATE ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ============ LOGGING ============
logging.level.org.springframework=INFO
logging.level.com.dmart.clone=DEBUG
logging.level.com.zaxxer.hikari=INFO

# ============ API DOCS ============
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ============ JWT ============
# Set APP_JWT_SECRET in every real environment; the default is a dev-only value.
app.jwt.secret=${APP_JWT_SECRET:MySuperSecureJwtSecretKeyThatIsAtLeast32Chars!}
app.jwt.expirationMs=${APP_JWT_EXPIRATION_MS:3600000}
app.jwt.refreshExpirationMs=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# ============ FILE UPLOAD ============
disk.upload.basepath=D:/Personal Projects/QuickBasket-Ecommerce-System/Images
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============ ADMIN SEEDER ============
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}
app.admin.password=${APP_ADMIN_PASSWORD:Adminpassword@123}

# ============ RAZORPAY ============
# Provide real keys via env vars; do not commit secret values.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ============ RATE LIMITING ============
app.ratelimit.auth.requests-per-minute=10
app.ratelimit.api.requests-per-minute=60

# ============ REDIS ============
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# Cache TTL (seconds)
app.cache.ttl.default=300
app.cache.ttl.categories=1800
app.cache.ttl.products=300

# ============ KAFKA (OMS INTEGRATION) ============
# Bootstrap servers overridable via env var; defaults to local broker.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer (QuickBasket -> oms.orders.inbound)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Consumer (QuickBasket <- oms.orders.status)
spring.kafka.consumer.group-id=quickbasket
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dmart.clone.messaging.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.dmart.clone.messaging.dto.OrderStatusEvent

# Topic names (shared contract with OMS)
app.kafka.topic.orders-inbound=oms.orders.inbound
app.kafka.topic.orders-status=oms.orders.status
